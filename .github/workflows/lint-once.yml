name: Lint (one-off debug sweep)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Android Lint (universal FOSS debug)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android packages
        run: sdkmanager "platforms;android-37.0" "ndk;27.0.12077973"

      - name: Create CI debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run Android Lint
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:lintUniversalFossDebug

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-universalFossDebug.html
            app/build/reports/lint-results-universalFossDebug.xml
          if-no-files-found: warn
          retention-days: 7
