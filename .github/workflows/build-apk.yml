name: Build Soundwave APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FOSS universal debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android packages
        run: sdkmanager "platforms;android-37.0" "ndk;27.0.12077973"

      - name: Create CI debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleUniversalFossDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: soundwave-foss-universal-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
